[project]
name = "stormtracker"
version = "0.1.0"
description = "Multimodal ear-training assignment grader via Telegram Webhooks"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",

    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pgvector==0.3.6",

    "langgraph>=1.1.0",
    "langchain>=0.3.0",
    "langchain-core>=1.3.0",
    "langchain-google-genai>=4.0.0",
    "google-genai>=1.0.0",
    "langchain-openai>=1.1.0",

    "langfuse>=3.0.0",
    "redis==5.2.1",
    "arq>=0.25.0",

    "python-multipart==0.0.20",
    "argon2-cffi==23.1.0",
    "matplotlib>=3.8.0",
    "fpdf2>=2.7.9",
    "pytz>=2024.1",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit test for isolated utility functions and schemas",
    "integration: Integration test for database queries and agent workflows",
    "asyncio: Asyncio coroutine test mark",
]
