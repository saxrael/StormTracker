services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stormtracker:latest
    restart: unless-stopped
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --log-level info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  worker:
    image: stormtracker:latest
    restart: unless-stopped
    env_file: .env
    command: arq app.worker.WorkerSettings
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
